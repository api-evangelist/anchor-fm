name: Anchor FM
description: 'Anchor FM was a podcast creation, hosting, distribution, and monetization
  platform founded in 2015 that let anyone record, edit, publish, and monetize a podcast
  for free from a phone or browser. Spotify acquired Anchor in 2019 and folded the
  product into Spotify for Podcasters, later rebranded Spotify for Creators; the
  anchor.fm domain now redirects to creators.spotify.com. Anchor never published a
  public developer API or developer portal, so this API Evangelist profile carries
  company identity and domain-security posture only. Originally surfaced as a portfolio
  company of Accel (consumer sector).'
